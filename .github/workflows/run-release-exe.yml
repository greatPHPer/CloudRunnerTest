name: Run GitHub Release EXE

on:
  workflow_dispatch:
    inputs:
      exe_url:
        description: "Direct HTTPS URL to a trusted GitHub Release .exe asset"
        required: true
        type: string
        default: "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe"
      sha256:
        description: "Expected SHA-256 from the trusted publisher (64 hexadecimal characters)"
        required: true
        type: string
        default: "a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627"
      arguments:
        description: "Command-line arguments; do not put passwords, API keys, or secrets here"
        required: false
        type: string
        default: "--version"

permissions: {}

jobs:
  run-exe:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Download, verify, and run the EXE
        shell: pwsh
        env:
          EXE_URL: \${{ inputs.exe_url }}
          EXPECTED_SHA256: \${{ inputs.sha256 }}
          EXE_ARGUMENTS: \${{ inputs.arguments }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reportPath = Join-Path $env:RUNNER_TEMP 'cloudrunner-exe-result.txt'
          $exePath = Join-Path $env:RUNNER_TEMP 'cloudrunner-test.exe'
          $report = [System.Collections.Generic.List[string]]::new()
          $outcome = 'FAILED'
          $safeUrl = '(not accepted)'
          $hashVerified = 'No'
          $sizeBytes = 0
          $exitCode = 'not run'
          $process = $null
          $uri = $null

          $report.Add('CloudRunner free Windows EXE smoke-test report')
          $report.Add("UTC started: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))")

          try {
            if (-not [Uri]::TryCreate($env:EXE_URL, [UriKind]::Absolute, [ref]$uri)) {
              throw 'Please provide a valid absolute URL.'
            }
            if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'github.com' -or $uri.Query -or $uri.Fragment) {
              throw 'Only clean HTTPS GitHub Release asset URLs are accepted.'
            }
            $assetPath = [Uri]::UnescapeDataString($uri.AbsolutePath)
            if ($assetPath -notmatch '^/[^/]+/[^/]+/releases/download/[^/]+/[^/]+\.exe$') {
              throw 'URL must be a direct .exe asset under /owner/repo/releases/download/tag/.'
            }
            if ($env:EXPECTED_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') {
              throw 'Expected SHA-256 must contain exactly 64 hexadecimal characters.'
            }

            $safeUrl = $uri.AbsoluteUri
            $report.Add("Download URL: $safeUrl")
            $report.Add('SHA-256 expected: supplied')

            Write-Host 'Downloading the release asset to the temporary cloud VM...'
            & curl.exe --fail --location --max-redirs 5 --max-filesize 26214400 --proto '=https' --proto-redir '=https' --output $exePath $uri.AbsoluteUri
            if ($LASTEXITCODE -ne 0) { throw 'Download failed or exceeded the 25 MB limit.' }

            $file = Get-Item -LiteralPath $exePath
            $sizeBytes = $file.Length
            if ($file.Length -lt 2 -or $file.Length -gt 25MB) { throw 'Downloaded file must be between 2 bytes and 25 MB.' }

            $stream = [IO.File]::OpenRead($exePath)
            try { $first = $stream.ReadByte(); $second = $stream.ReadByte() }
            finally { $stream.Dispose() }
            if ($first -ne 0x4D -or $second -ne 0x5A) { throw 'Downloaded asset does not have a Windows executable header.' }

            $actualHash = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
            if ($actualHash -ne $env:EXPECTED_SHA256.ToUpperInvariant()) {
              throw "SHA-256 mismatch. Expected $($env:EXPECTED_SHA256); got $actualHash."
            }
            $hashVerified = 'Yes'
            $report.Add("Downloaded bytes: $sizeBytes")
            $report.Add("SHA-256 actual: $actualHash")
            $report.Add('SHA-256 verified: Yes')
            Write-Host "Downloaded and checksum-verified $sizeBytes bytes."

            Write-Host 'Running the executable on the temporary Windows runner (60-second limit)...'
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $exePath
            $start.WorkingDirectory = $env:RUNNER_TEMP
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Arguments = $env:EXE_ARGUMENTS

            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            if (-not $process.Start()) { throw 'Windows could not start the executable.' }

            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill($true) } catch {}
              throw 'The executable exceeded the 60-second limit and was stopped.'
            }
            $stdoutFull = $stdoutTask.GetAwaiter().GetResult()
            $stderrFull = $stderrTask.GetAwaiter().GetResult()
            $exitCode = $process.ExitCode

            $stdout = if ($stdoutFull.Length -gt 10000) { $stdoutFull.Substring(0, 10000) + [Environment]::NewLine + '[Output truncated after 10,000 characters]' } else { $stdoutFull }
            $stderr = if ($stderrFull.Length -gt 10000) { $stderrFull.Substring(0, 10000) + [Environment]::NewLine + '[Output truncated after 10,000 characters]' } else { $stderrFull }

            Write-Host '----- STDOUT -----'
            if ($stdout) { Write-Output $stdout } else { Write-Host '(no standard output)' }
            Write-Host '----- STDERR -----'
            if ($stderr) { Write-Output $stderr } else { Write-Host '(no standard error)' }
            Write-Host "Exit code: $exitCode"

            $report.Add('')
            $report.Add('----- STDOUT -----')
            if ($stdout) { $report.AddRange([string[]]($stdout -split "\r?\n")) } else { $report.Add('(no standard output)') }
            $report.Add('----- STDERR -----')
            if ($stderr) { $report.AddRange([string[]]($stderr -split "\r?\n")) } else { $report.Add('(no standard error)') }
            $report.Add("Exit code: $exitCode")

            if ($exitCode -ne 0) { throw "Executable returned non-zero exit code $exitCode." }
            $outcome = 'SUCCESS'
            $report.Add('Result: SUCCESS')
          }
          catch {
            $report.Add('Result: FAILED')
            $report.Add("Failure: $($_.Exception.Message)")
            throw
          }
          finally {
            if ($process) {
              try { if (-not $process.HasExited) { $process.Kill($true) } } catch {}
              $process.Dispose()
            }
            Remove-Item -LiteralPath $exePath -Force -ErrorAction SilentlyContinue
            $report.Add('Temporary executable cleanup: completed')
            $report.Add("UTC finished: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))")

            try {
              $report | Set-Content -LiteralPath $reportPath -Encoding utf8
              if ($env:GITHUB_STEP_SUMMARY) {
                @(
                  '## CloudRunner Windows EXE smoke test'
                  ''
                  "- **Result:** $outcome"
                  "- **Download URL:** $safeUrl"
                  "- **Downloaded bytes:** $sizeBytes"
                  "- **SHA-256 verified:** $hashVerified"
                  "- **Exit code:** $exitCode"
                  ''
                  'The text report is attached as a short-retention workflow artifact.'
                  'This workflow is a headless command-line test; it does not provide live GUI streaming.'
                ) | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              }
            }
            catch {
              Write-Warning "Could not write the result report or step summary: $($_.Exception.Message)"
            }
            Write-Host 'Temporary executable cleanup finished.'
          }

      - name: Upload text result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudrunner-exe-result-\${{ github.run_number }}
          path: \${{ runner.temp }}/cloudrunner-exe-result.txt
          if-no-files-found: warn
          retention-days: 1
