name: Test GitHub Release EXE

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-release-exe:
    name: Run jq from its official GitHub release
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - name: Download, verify, and run jq
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'jq.exe'

          try {
            Write-Host 'Downloading the fixed jq release asset to this temporary cloud runner...'
            & curl.exe --fail --location --max-redirs 5 --max-filesize 26214400 --proto '=https' --proto-redir '=https' --output $exe $url
            if ($LASTEXITCODE -ne 0) {
              throw 'Download failed or exceeded 25 MB.'
            }

            $file = Get-Item -LiteralPath $exe
            if ($file.Length -lt 2 -or $file.Length -gt 25MB) {
              throw 'Downloaded file has an unexpected size.'
            }

            $stream = [IO.File]::OpenRead($exe)
            try {
              $first = $stream.ReadByte()
              $second = $stream.ReadByte()
            } finally {
              $stream.Dispose()
            }

            if ($first -ne 0x4D -or $second -ne 0x5A) {
              throw 'Downloaded asset does not have a Windows executable header.'
            }

            $actualHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = 'a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627'
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch: expected trusted jq release hash, got $actualHash."
            }

            Write-Host "Downloaded and checksum-verified $($file.Length) bytes."
            Write-Host 'Running jq --version on the temporary Windows runner...'
            & $exe --version
            $exitCode = $LASTEXITCODE
            Write-Host "Exit code: $exitCode"
            if ($exitCode -ne 0) {
              throw "jq returned exit code $exitCode."
            }
          } finally {
            Remove-Item -LiteralPath $exe -Force -ErrorAction SilentlyContinue
            Write-Host 'Temporary executable cleanup finished.'
          }
